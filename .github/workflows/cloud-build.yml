name: Cloud Build (MCP-triggered)

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        default: 'linux'
        type: choice
        options:
          - linux
          - macos
          - linux+macos
      build_type:
        description: 'Build type'
        default: 'RelWithDebInfo'
        type: choice
        options:
          - Debug
          - RelWithDebInfo
          - Release
      with_python:
        description: 'Python bindings'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: Linux Cloud Build
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - name: Set build options (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "BUILD_TYPE=${{ inputs.build_type }}" >> $GITHUB_ENV
          echo "WITH_PYTHON=${{ inputs.with_python && 'ON' || 'OFF' }}" >> $GITHUB_ENV

      - name: Set default options (push/PR)
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "BUILD_TYPE=RelWithDebInfo" >> $GITHUB_ENV
          echo "WITH_PYTHON=ON" >> $GITHUB_ENV

      - run: sudo apt-get update
      - name: Install dependencies
        run: sudo apt-get install -y gettext cmake libxslt-dev xsltproc ninja-build libboost-all-dev libgtk-3-dev guile-2.2-dev libgwengui-gtk3-dev libaqbanking-dev libofx-dev libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.0-dev googletest
      - run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr

      - run: mkdir -p ${{ runner.temp }}/inst build
      - name: Configure
        run: |
          cd build
          cmake -G Ninja -DWITH_PYTHON=${{ env.WITH_PYTHON }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/inst $GITHUB_WORKSPACE

      - name: Build
        run: cd build && ninja -j$(nproc)

      - name: Test
        if: env.BUILD_TYPE != 'Release'
        run: cd build && ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: On

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestLog-linux
          path: build/Testing/Temporary/LastTest.log
